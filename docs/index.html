<style>
:root{--cafe:#4b2e1e;--cafe2:#7a4a2c;--crema:#f6efe6;--oro:#c8963e;--borde:#e2d5c5}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--crema);color:#2b1a10;padding-bottom:40px}
header{background:var(--cafe);color:#fff;text-align:center;padding:14px 10px;padding-top:calc(18px + env(safe-area-inset-top))}
.logo{font-size:28px;font-weight:800;letter-spacing:6px;color:var(--oro)}
header h1{margin:4px 0 0;font-size:16px;font-weight:500;letter-spacing:1px}
.panel,.card{background:#fff;margin:12px;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(75,46,30,.08)}
label{display:block;font-size:12px;color:var(--cafe2);font-weight:600;margin-bottom:8px}
input,select{width:100%;padding:10px;border:1px solid var(--borde);border-radius:8px;font-size:16px;margin-top:4px;background:#fffdfa}
.resumen{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.resumen div{background:var(--crema);border-radius:8px;padding:8px;font-size:12px}
.resumen b{display:block;font-size:15px;color:var(--cafe)}
.card-head{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.num{background:var(--cafe);color:#fff;border-radius:50%;min-width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:700}
.nombre{font-weight:700;font-size:17px;margin:0;border:1px dashed var(--borde)}
.sust{background:var(--crema);border:1px solid var(--borde);border-radius:8px;padding:8px;font-size:12px;white-space:nowrap;color:var(--cafe)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:6px}
.out{background:var(--crema);border-radius:8px;padding:8px;font-size:11px;color:var(--cafe2);font-weight:600}
.out b{display:block;font-size:14px;color:var(--cafe);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
.desglose{margin-top:8px}
.desglose td{padding:7px 4px;border-bottom:1px solid var(--borde)}
.desglose td:last-child{text-align:right;font-weight:600}
.tot td{background:var(--cafe);color:#fff;font-weight:700;border:none}
.firma{margin-top:12px;text-align:center}
.firma canvas{width:100%;height:110px;border:1px dashed var(--cafe2);border-radius:8px;background:#fffdfa;touch-action:none}
.firma small{display:block;border-top:1px solid #333;margin:4px 30px 0;padding-top:2px}
.borrar{font-size:11px;background:none;border:none;color:var(--cafe2);text-decoration:underline}
.leyenda{margin-top:10px;border:1.5px solid var(--oro);border-radius:10px;padding:10px;background:#fffaf1;font-size:11px;line-height:1.4;text-align:justify}
.leyenda b{display:block;color:var(--cafe);margin-bottom:4px;text-align:center}
