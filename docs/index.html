<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Koffein</title>
<link rel="manifest" href="manifest.json">
<style>
body{font-family:-apple-system,Helvetica,sans-serif;background:#f2efe9;color:#222;margin:0;padding:12px 12px 90px}
h1{text-align:center;color:#5a3a22;margin:8px 0 14px}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
label{display:block;font-size:14px;margin:6px 0}
input{font-size:16px;padding:6px;border:1px solid #ccc;border-radius:6px;width:100%;box-sizing:border-box}
input[type=checkbox]{width:auto}
.emp{border-bottom:1px solid #eee;padding:8px 0}
.chk{display:flex;gap:6px;align-items:center}
button{font-size:16px;padding:10px;border:0;border-radius:8px;background:#5a3a22;color:#fff;margin-top:6px}
.del{background:#b33;font-size:14px;padding:6px 10px}
#semana{font-weight:bold;margin-top:8px;color:#5a3a22}
table{width:100%;border-collapse:collapse}
td{padding:4px 0;border-bottom:1px solid #eee}
td:last-child{text-align:right}
.tot td{font-weight:bold}
.ley{font-size:12px;margin-top:10px}
.firma{margin-top:18px}
.botones{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:10px;background:#f2efe9}
.botones button{flex:1;margin:0}
#aviso{display:none;position:sticky;top:0;z-index:9;background:#ffd84d;color:#333;padding:10px;border-radius:8px;margin-bottom:10px;font-weight:bold;text-align:center}
  /* Barra inferior en una sola línea */
.botones{
  display:flex !important;
  flex-wrap:nowrap !important;
  gap:6px;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
}
.botones button{
  flex:1 1 0;
  min-width:0;
  padding:10px 4px;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
/* Espacio para que la barra no tape el contenido */
body{ padding-bottom:80px; }

/* Firma: que el dedo no mueva la página */
canvas{
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}
@media print {
  @page {
    size: letter portrait;   /* usa "A4 portrait" si imprimes en A4 */
    margin: 12mm;
  }

  html, body {
    margin: 0 !important;
    padding: 0 !important;
    background: #fff !important;
  }

  /* El resumen va solo en su propia hoja */
  #resumen {
    break-after: page;
    page-break-after: always;
  }

  /* Un recibo por hoja, sin cortes */
  .recibo {
    box-sizing: border-box;
    height: auto !important;
    max-height: none !important;
    overflow: visible !important;
    margin: 0 !important;
    padding: 6mm 8mm !important;
    border: 1px solid #999;
    font-size: 13px !important;
    line-height: 1.4;
    break-inside: avoid;
    page-break-inside: avoid;
    break-after: page;
    page-break-after: always;
  }

  /* Que el último recibo no deje una hoja en blanco */
  .recibo:last-of-type {
    break-after: auto;
    page-break-after: auto;
  }

  .recibo table {
    width: 100%;
    border-collapse: collapse;
  }

  .recibo td, .recibo th {
    padding: 3px 6px !important;
  }

  /* Firma */
  .recibo canvas {
    width: 100% !important;
    height: 40mm !important;
    border: none !important;
    border-bottom: 1px solid #000 !important;
  }

  /* Ocultar botones y elementos de la app */
  button, .botones, input[type="button"] {
    display: none !important;
  }
}
  
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div id="aviso"></div>
<div style="text-align:center"><img src="koffein-icon.png" alt="Koffein" style="width:110px;border-radius:20px;margin-top:6px"></div>
<h1>Koffein</h1>

<section class="card">
  <label>Inicio de semana <input type="date" id="ini"></label>
  <label>Fin de semana <input type="date" id="fin"></label>
  <div id="semana"></div>
</section>

<section class="card">
  <label>Propinas totales de la semana ($)
    <input type="number" id="prop" inputmode="decimal" value="0">
  </label>
</section>

<section class="card">
  <h2>Empleados</h2>
  <div id="emps"></div>
  <button id="btnAdd">+ Agregar empleado</button>
</section>

<div id="resumen"></div>
<div id="recibos"></div>

<div class="botones">
  <button id="btnGuardar">Guardar semana</button>
  <button id="btnExportar">Exportar Excel</button>
</div>

<script src="app.js?v=22"></script>
</body>
</html>
