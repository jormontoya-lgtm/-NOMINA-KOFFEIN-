<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nómina Semanal Koffein</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4b2e1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nómina Koffein">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png?v=8">
<link rel="stylesheet" href="app.css?v=7">
<style>.auto{background:#f6efe6;font-weight:700;color:#4b2e1e}.pesos{display:flex;align-items:center;gap:6px}.pesos span{font-weight:700;font-size:18px;color:#4b2e1e}.pesos input{flex:1}</style>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
<header><img src="icon.svg" class="logo" alt="Koffein"><h1>Nómina Semanal Koffein</h1></header>
<section class="box">
<label>Semana del<input type="date" id="ini"></label>
<label>al<input type="date" id="fin"></label>
<label>Percepciones salariales totales ($)<input type="text" id="tsal" class="auto" readonly></label>
<label>Total de horas extras ($)<input type="text" id="thx" class="auto" readonly></label>
<label>Total de propinas de la semana<div class="pesos"><span>$</span><input type="number" id="prop" inputmode="decimal" step="any" value="0"></div></label>
</section>
<div id="lista"></div>
<div class="acc">
<button id="add">+ Agregar empleado</button>
<button id="save">💾 Guardar semana</button>
<button id="xls">📊 Exportar Excel del mes</button>
<button onclick="window.print()">🖨️ Imprimir / PDF</button>
</div>
<script src="app.js?v=8"></script>
</body>
</html>
